<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AURA</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-inner">
        <div class="logo" aria-hidden="true">A</div>
        <div class="titles">
          <h1 class="name">AURA</h1>
          <p class="tagline">Artificial Universal Reasoning Assistant</p>
        </div>
        <span class="status-dot" title="Status"></span>
      </div>
    </header>

    <main id="messages" class="messages" aria-live="polite" aria-label="Chat messages"></main>

    <form id="chat-form" class="composer" autocomplete="off">
      <textarea
        id="chat-input"
        class="input"
        rows="1"
        placeholder="Message AURA…"
        aria-label="Message AURA"
      ></textarea>
      <button id="send-btn" class="send-btn" type="submit" aria-label="Send message">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
