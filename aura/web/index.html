<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AURA</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app" data-livestate="ready">
    <header class="header">
      <div class="header-inner">
        <div class="brand">
          <div class="logo" aria-hidden="true">A</div>
          <div class="titles">
            <h1 class="name">AURA</h1>
            <p class="tagline">Artificial Universal Reasoning Assistant</p>
          </div>
        </div>

        <div class="hero-orb" aria-hidden="true">
          <div id="aura-orb" class="orb"></div>
          <div class="orb-ring ring-1"></div>
          <div class="orb-ring ring-2"></div>
        </div>

        <div class="live-controls">
          <span class="status-dot" title="Connection status" aria-hidden="true"></span>
          <button id="live-btn" class="live-btn" type="button" aria-label="Start Live mode">Live</button>
          <button id="stop-live-btn" class="stop-live-btn" type="button" hidden aria-label="Stop Live mode">Stop</button>
          <div id="live-status" class="live-status" role="status" aria-live="polite">Ready</div>
        </div>
      </div>
    </header>

    <main id="messages" class="messages" aria-live="polite" aria-label="Chat messages"></main>

    <form id="chat-form" class="composer" autocomplete="off">
      <button id="rec-btn" class="rec-btn" type="button" hidden aria-label="Record microphone input">
        <span class="btn-icon" aria-hidden="true">●</span>
        <span class="btn-label">Record</span>
      </button>
      <textarea
        id="chat-input"
        class="input"
        rows="1"
        placeholder="Message AURA…"
        aria-label="Message AURA"
      ></textarea>
      <button id="send-btn" class="send-btn" type="submit" aria-label="Send message">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
